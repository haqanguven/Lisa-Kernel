name: Lisa Android 17 experimental kernel
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: lisa-kernel-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Free temporary runner disk for kernel build
        run: |
          df -h /
          # Disposable hosted-runner SDKs are not needed for a kernel-only build.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import pinned kernel source if needed
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Makefile && -f Documentation/lisa-a17/source-import-v2 ]]; then
            echo 'Complete tracked kernel source already imported'
            exit 0
          fi
          upstream_dir=$(mktemp -d "$RUNNER_TEMP/lisa-upstream.XXXXXX")
          git -C "$upstream_dir" init
          git -C "$upstream_dir" remote add origin https://github.com/MirahSyakilla/android_kernel_xiaomi_lisa.git
          git -C "$upstream_dir" fetch --depth=1 origin 240b4a2e8265ce2100024a4e94b596b35a2d6afe
          git -C "$upstream_dir" checkout --detach FETCH_HEAD
          git -C "$upstream_dir" apply "$GITHUB_WORKSPACE/patches/lisa-a17-code.patch"
          mkdir -p "$upstream_dir/Documentation/lisa-a17"
          for upstream_readme in README README.md; do
            if [[ -f "$upstream_dir/$upstream_readme" ]]; then
              cp "$upstream_dir/$upstream_readme" "$upstream_dir/Documentation/lisa-a17/upstream-$upstream_readme"
            fi
          done
          # Keep project metadata and avoid importing unrelated upstream workflows.
          tar -C "$upstream_dir" --exclude='./.git' --exclude='./.github' \
            --exclude='./README' --exclude='./README.md' -cf - . | tar -C "$GITHUB_WORKSPACE" --skip-old-files -xf -
          gzip -dc configs/lisa_hyperos17.config.gz > arch/arm64/configs/lisa_hyperos17_defconfig
          printf '\n/out/\n/kernel-build.log\n' >> .gitignore
          # Upstream tracks some files matched by its own ignore patterns.
          # Force-add its tracked manifest, preserving existing file contents.
          source_manifest=$(mktemp "$RUNNER_TEMP/lisa-source-manifest.XXXXXX")
          while IFS= read -r -d '' source_path; do
            case "$source_path" in README|README.md|.github/*) continue ;; esac
            if [[ -e "$source_path" || -L "$source_path" ]]; then
              printf '%s\0' "$source_path" >> "$source_manifest"
            fi
          done < <(git -C "$upstream_dir" ls-files -z)
          git add -f --pathspec-from-file="$source_manifest" --pathspec-file-nul
          mkdir -p Documentation/lisa-a17
          printf '%s\n' '240b4a2e8265ce2100024a4e94b596b35a2d6afe' > Documentation/lisa-a17/source-import-v2
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git add -f Documentation/lisa-a17/source-import-v2 arch/arm64/configs/lisa_hyperos17_defconfig
          git commit -q -m 'Import pinned Lisa kernel source and Android 17 compatibility changes'
          git push origin HEAD:main
          case "$upstream_dir" in
            "$RUNNER_TEMP"/lisa-upstream.*) rm -rf -- "$upstream_dir" ;;
          esac
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make flex bison \
            libssl-dev libelf-dev dwarves bc cpio binutils-aarch64-linux-gnu
      - name: Fetch pinned Proton clang toolchain
        shell: bash
        run: |
          set -euo pipefail
          clang_dir=$(mktemp -d "$RUNNER_TEMP/lisa-clang.XXXXXX")
          git -C "$clang_dir" init
          git -C "$clang_dir" remote add origin https://github.com/kdrag0n/proton-clang.git
          git -C "$clang_dir" fetch --depth=1 origin 9fb011b183fe7e69b04b873ef6533b4b077e3c5e
          git -C "$clang_dir" checkout --detach FETCH_HEAD
          echo "CLANG_BIN=$clang_dir/bin" >> "$GITHUB_ENV"
      - name: Provision build swap
        shell: bash
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP"
          available_mb=$(df -Pm "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          swap_mb=$((available_mb - 8192))
          if ((swap_mb > 8192)); then swap_mb=8192; fi
          if ((swap_mb < 2048)); then
            echo 'Insufficient free disk space for swap and kernel build outputs' >&2
            exit 1
          fi
          swap_path="$RUNNER_TEMP/lisa-build.swap"
          sudo fallocate -l "${swap_mb}M" "$swap_path"
          sudo chmod 600 "$swap_path"
          sudo mkswap "$swap_path"
          sudo swapon "$swap_path"
          free -h
      - name: Build kernel and audit candidate modules
        shell: bash
        run: |
          set -o pipefail
          chmod +x build-lisa.sh
          JOBS=4 ./build-lisa.sh 2>&1 | tee kernel-build.log
      - name: Upload build outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-a17-experimental-${{ github.run_number }}
          path: |
            out/lisa-a17/artifacts/Image
            out/lisa-a17/artifacts/modules.tar.gz
            out/lisa-a17/artifacts/kernel.config
            out/lisa-a17/artifacts/Module.symvers
            out/lisa-a17/artifacts/modules.builtin
            out/lisa-a17/artifacts/modules.order
            out/lisa-a17/artifacts/candidate-module-abi.json
            out/lisa-a17/artifacts/SHA256SUMS
            kernel-build.log
          if-no-files-found: error

